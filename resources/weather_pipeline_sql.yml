resources:
  pipelines:
    weather_pipeline_sql:
      name: weather_pipeline_sql_${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      configuration:
        source_table: ${var.catalog}.${var.schema}.daily_weather
      libraries:
        - file:
            path: ../pipelines/monthly_weather.sql
